---
- name: Create application group
  ansible.builtin.group:
    name: '{{ app_group }}'
    system: true
- name: Create application user
  ansible.builtin.user:
    name: '{{ app_user }}'
    group: '{{ app_group }}'
    system: true
    home: /app
    create_home: false
    shell: /sbin/nologin
- name: Create application directory
  ansible.builtin.file:
    path: /app
    state: directory
    owner: '{{ app_user }}'
    group: '{{ app_group }}'
    mode: '0755'
- name: Check application entry point
  ansible.builtin.stat:
    path: '{{ app_entry_path }}'
  register: app_entry
- name: Download application
  ansible.builtin.get_url:
    url: '{{ artifact_base_url }}/{{ app_name }}-{{ app_version }}.zip'
    dest: /tmp/{{ app_name }}-{{ app_version }}.zip
    mode: '0644'
  register: artifact
- name: Extract application when artifact changes or app is missing
  ansible.builtin.unarchive:
    src: /tmp/{{ app_name }}-{{ app_version }}.zip
    dest: /app
    remote_src: true
    owner: '{{ app_user }}'
    group: '{{ app_group }}'
  when: artifact.changed or not (app_entry.stat.exists | default(false))
  register: extracted
  notify: Restart application
