---
- name: Create configuration directory
  ansible.builtin.file:
    path: /etc/roboshop
    state: directory
    mode: '0755'
- name: Store RabbitMQ password securely
  ansible.builtin.copy:
    dest: /etc/roboshop/{{ app_name }}.env
    content: 'AMQP_PASS={{ rabbitmq_password }}

      '
    owner: root
    group: '{{ app_group }}'
    mode: '0640'
  no_log: true
  notify: Restart application
