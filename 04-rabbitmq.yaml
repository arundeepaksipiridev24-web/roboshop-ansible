---
- name: Install and configure RabbitMQ 4.x
  hosts: rabbitmq
  become: true

  tasks:
    - name: Copy RabbitMQ repository
      ansible.builtin.copy:
        src: rabbitmq.repo
        dest: /etc/yum.repos.d/rabbitmq.repo
        owner: root
        group: root
        mode: "0644"

    - name: Install Erlang and RabbitMQ
      ansible.builtin.dnf:
        name:
          - erlang
          - rabbitmq-server
        state: present
        update_cache: true

    - name: Start and enable RabbitMQ
      ansible.builtin.systemd_service:
        name: rabbitmq-server
        state: started
        enabled: true

    - name: Configure RoboShop RabbitMQ user and permissions
      community.rabbitmq.rabbitmq_user:
        user: "{{ rabbitmq_user }}"
        password: "{{ rabbitmq_password }}"
        update_password: always
        vhost: /
        configure_priv: .*
        read_priv: .*
        write_priv: .*
        state: present
      no_log: true

    - name: Verify RabbitMQ version
      ansible.builtin.command:
        cmd: rabbitmqctl version
      register: rabbitmq_version
      changed_when: false

    - name: Display RabbitMQ version
      ansible.builtin.debug:
        msg: "{{ rabbitmq_version.stdout }}"

    - name: Verify RabbitMQ AMQP port
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 5672
        timeout: 30

    - name: Display completion
      ansible.builtin.debug:
        msg: "RabbitMQ configured successfully"
