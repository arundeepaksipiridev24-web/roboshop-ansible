---
- name: Install and configure RabbitMQ 4.x
  hosts: rabbitmq
  become: true

  tasks:
    - name: Copy RabbitMQ repository
      ansible.builtin.copy:
        src: rabbitmq.repo
        dest: /etc/yum.repos.d/rabbitmq.repo
        owner: root
        group: root
        mode: "0644"

    - name: Install Erlang and RabbitMQ
      ansible.builtin.dnf:
        name:
          - erlang
          - rabbitmq-server
        state: present
        update_cache: true

    - name: Start and enable RabbitMQ
      ansible.builtin.systemd:
        name: rabbitmq-server
        state: started
        enabled: true

    - name: List RabbitMQ users
      ansible.builtin.command:
        argv: [rabbitmqctl, -q, list_users, --formatter, json]
      register: rabbitmq_existing_users
      changed_when: false

    - name: Create the RoboShop RabbitMQ user
      ansible.builtin.command:
        argv: [rabbitmqctl, add_user, "{{ rabbitmq_user }}", "{{ rabbitmq_password }}"]
      when: rabbitmq_user not in (rabbitmq_existing_users.stdout | from_json | map(attribute='user') | list)
      no_log: true

    - name: Check the configured RabbitMQ password
      ansible.builtin.command:
        argv: [rabbitmqctl, authenticate_user, "{{ rabbitmq_user }}", "{{ rabbitmq_password }}"]
      register: rabbitmq_auth
      changed_when: false
      failed_when: false
      no_log: true

    - name: Apply the password from central credentials when it differs
      ansible.builtin.command:
        argv: [rabbitmqctl, change_password, "{{ rabbitmq_user }}", "{{ rabbitmq_password }}"]
      when: rabbitmq_auth.rc != 0
      no_log: true

    - name: Grant RoboShop permissions on the default virtual host
      ansible.builtin.command:
        argv: [rabbitmqctl, set_permissions, -p, /, "{{ rabbitmq_user }}", ".*", ".*", ".*"]
      changed_when: false

    - name: Verify RabbitMQ version
      ansible.builtin.command:
        cmd: rabbitmqctl version
      register: rabbitmq_version
      changed_when: false

    - name: Display RabbitMQ version
      ansible.builtin.debug:
        msg: "{{ rabbitmq_version.stdout }}"

    - name: Verify RabbitMQ AMQP port
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 5672
        timeout: 30

    - name: Display completion
      ansible.builtin.debug:
        msg: "RabbitMQ configured successfully"
