---
- name: Check control node AWS access
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  tasks:
    - name: Verify AWS credentials
      ansible.builtin.command:
        argv: ["{{ aws_cli }}", sts, get-caller-identity, --region, "{{ aws_region }}"]
      changed_when: false
      no_log: true
