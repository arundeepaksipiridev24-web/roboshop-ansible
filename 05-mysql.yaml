---
- name: Configure existing MySQL Community server
  hosts: mysql
  become: true

  tasks:
    - name: Check MySQL server package
      ansible.builtin.command:
        cmd: rpm -q mysql-community-server
      register: mysql_package
      changed_when: false

    - name: Display installed package
      ansible.builtin.debug:
        msg: "{{ mysql_package.stdout }}"

    - name: Start and enable MySQL
      ansible.builtin.systemd_service:
        name: mysqld
        state: started
        enabled: true

    - name: Check MySQL version
      ansible.builtin.command:
        cmd: mysql --version
      register: mysql_version
      changed_when: false

    - name: Display MySQL version
      ansible.builtin.debug:
        msg: "{{ mysql_version.stdout }}"
