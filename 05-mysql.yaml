---
- name: Install and configure MySQL 8.4
  hosts: mysql
  become: true
  gather_facts: false

  vars:
    mysql_root_password: "RoboShop@1"

  tasks:
    - name: Check installed MySQL Community packages
      ansible.builtin.shell: |
        rpm -qa | grep '^mysql-community-' || true
      register: community_packages
      changed_when: false

    - name: Stop existing MySQL service if conflicting packages exist
      ansible.builtin.systemd_service:
        name: mysqld
        state: stopped
      when: community_packages.stdout_lines | length > 0

    - name: Remove conflicting MySQL Community packages
      ansible.builtin.dnf:
        name: "{{ community_packages.stdout_lines }}"
        state: absent
      when: community_packages.stdout_lines | length > 0

    - name: Enable MySQL 8.4 module
      ansible.builtin.command:
        argv:
          - dnf
          - module
          - enable
          - mysql:8.4
          - -y
      changed_when: false

    - name: Install MySQL 8.4 server
      ansible.builtin.dnf:
        name: mysql-server
        state: present

    - name: Start and enable MySQL
      ansible.builtin.systemd_service:
        name: mysqld
        state: started
        enabled: true

    - name: Check root authentication with configured password
      ansible.builtin.command:
        argv:
          - mysql
          - -u
          - root
          - --batch
          - --skip-column-names
          - -e
          - SELECT 1
      environment:
        MYSQL_PWD: "{{ mysql_root_password }}"
      register: root_password_check
      changed_when: false
      failed_when: false
      no_log: true

    - name: Check whether passwordless root authentication works
      ansible.builtin.command:
        argv:
          - mysql
          - -u
          - root
          - --batch
          - --skip-column-names
          - -e
          - SELECT 1
      environment:
        MYSQL_PWD: ""
      register: passwordless_root_check
      changed_when: false
      failed_when: false
      no_log: true
      when: root_password_check.rc != 0

    - name: Set initial MySQL root password
      ansible.builtin.command:
        argv:
          - mysql_secure_installation
          - --set-root-pass
          - "{{ mysql_root_password }}"
      when:
        - root_password_check.rc != 0
        - passwordless_root_check.rc | default(1) == 0
      no_log: true

    - name: Verify root authentication after configuration
      ansible.builtin.command:
        argv:
          - mysql
          - -u
          - root
          - --batch
          - --skip-column-names
          - -e
          - SELECT 1
      environment:
        MYSQL_PWD: "{{ mysql_root_password }}"
      register: final_root_check
      changed_when: false
      failed_when: false
      no_log: true

    - name: Confirm MySQL root authentication
      ansible.builtin.assert:
        that:
          - final_root_check.rc == 0
          - final_root_check.stdout | trim == '1'
        fail_msg: >-
          MySQL root authentication failed.
          The existing root password may differ from
          mysql_root_password. Verify the current
          credentials before continuing.
        success_msg: "MySQL root authentication successful"

    - name: Verify MySQL version
      ansible.builtin.command:
        argv:
          - mysql
          - --version
      register: mysql_version
      changed_when: false

    - name: Display MySQL version
      ansible.builtin.debug:
        msg: "{{ mysql_version.stdout }}"

    - name: Verify MySQL service
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - mysqld
      register: mysql_service
      changed_when: false

    - name: Display MySQL service status
      ansible.builtin.debug:
        msg: "MySQL service: {{ mysql_service.stdout }}"
