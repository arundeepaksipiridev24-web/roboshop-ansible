---
- name: Install and configure MySQL 8.4
  hosts: mysql
  become: true

  vars:
    mysql_root_password: "RoboShop@1"

  tasks:
    - name: Check installed MySQL Community packages
      ansible.builtin.shell: |
        rpm -qa | grep '^mysql-community-' || true
      register: community_packages
      changed_when: false

    - name: Stop existing MySQL service
      ansible.builtin.systemd_service:
        name: mysqld
        state: stopped
      when: community_packages.stdout_lines | length > 0

    - name: Remove conflicting MySQL Community packages
      ansible.builtin.dnf:
        name: "{{ community_packages.stdout_lines }}"
        state: absent
      when: community_packages.stdout_lines | length > 0

    - name: Enable MySQL 8.4 module
      ansible.builtin.command:
        cmd: dnf module enable mysql:8.4 -y
      changed_when: false

    - name: Install MySQL 8.4 server
      ansible.builtin.dnf:
        name: mysql-server
        state: present

    - name: Start and enable MySQL
      ansible.builtin.systemd_service:
        name: mysqld
        state: started
        enabled: true

    - name: Check whether MySQL root password is configured
      ansible.builtin.command:
        argv:
          - mysql
          - -u
          - root
          - --batch
          - --skip-column-names
          - -e
          - SELECT 1
      register: mysql_root_check
      changed_when: false
      failed_when: false
      no_log: true

    - name: Set MySQL root password
      ansible.builtin.command:
        argv:
          - mysql_secure_installation
          - --set-root-pass
          - "{{ mysql_root_password }}"
      when: mysql_root_check.rc == 0
      no_log: true

    - name: Verify MySQL version
      ansible.builtin.command:
        cmd: mysql --version
      register: mysql_version
      changed_when: false

    - name: Display MySQL version
      ansible.builtin.debug:
        msg: "{{ mysql_version.stdout }}"

    - name: Verify MySQL service
      ansible.builtin.command:
        cmd: systemctl is-active mysqld
      register: mysql_service
      changed_when: false

    - name: Display MySQL service status
      ansible.builtin.debug:
        msg: "MySQL service: {{ mysql_service.stdout }}"
