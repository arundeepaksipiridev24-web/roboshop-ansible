---
- name: Install and configure MySQL 8.4
  hosts: mysql
  become: true

  tasks:
    - name: Enable MySQL 8.4 module
      ansible.builtin.command:
        cmd: dnf module enable mysql:8.4 -y
      register: mysql_module
      changed_when: "'Enabling module streams' in mysql_module.stdout"

    - name: Install MySQL server
      ansible.builtin.dnf:
        name: mysql-server
        state: present

    - name: Enable and start MySQL
      ansible.builtin.systemd_service:
        name: mysqld
        enabled: true
        state: started

    - name: Verify MySQL port
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 3306
        timeout: 30

    - name: Verify MySQL version
      ansible.builtin.command:
        cmd: mysql --version
      register: mysql_version
      changed_when: false

    - name: Display MySQL version
      ansible.builtin.debug:
        msg: "{{ mysql_version.stdout }}"
