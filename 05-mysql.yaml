---
- name: Install and configure MySQL 8.4
  hosts: mysql
  become: true

  tasks:
    - name: Check existing MySQL Community packages
      ansible.builtin.shell: |
        rpm -qa | grep '^mysql-community-' || true
      register: existing_mysql
      changed_when: false

    - name: Display existing packages
      ansible.builtin.debug:
        var: existing_mysql.stdout_lines

    - name: Stop existing MySQL service
      ansible.builtin.systemd_service:
        name: mysqld
        state: stopped
      when: existing_mysql.stdout | length > 0

    - name: Remove conflicting MySQL Community packages
      ansible.builtin.dnf:
        name: "{{ existing_mysql.stdout_lines }}"
        state: absent
      when: existing_mysql.stdout_lines | length > 0

    - name: Enable MySQL 8.4 module
      ansible.builtin.command:
        cmd: dnf module enable mysql:8.4 -y
      register: mysql_module
      changed_when: "'Enabling module streams' in mysql_module.stdout"

    - name: Install MySQL 8.4 server
      ansible.builtin.dnf:
        name: mysql-server
        state: present

    - name: Start and enable MySQL
      ansible.builtin.systemd_service:
        name: mysqld
        state: started
        enabled: true

    - name: Verify MySQL version
      ansible.builtin.command:
        cmd: mysql --version
      register: mysql_version
      changed_when: false

    - name: Display MySQL version
      ansible.builtin.debug:
        msg: "{{ mysql_version.stdout }}"
