---
- name: Install and configure Redis 7
  hosts: redis
  become: true

  tasks:
    - name: Disable default Redis module
      ansible.builtin.command:
        cmd: dnf module disable redis -y
      register: redis_disable
      changed_when: "'Disabling modules' in redis_disable.stdout"

    - name: Enable Redis 7 module
      ansible.builtin.command:
        cmd: dnf module enable redis:7 -y
      register: redis_enable
      changed_when: "'Enabling module streams' in redis_enable.stdout"

    - name: Install Redis
      ansible.builtin.dnf:
        name: redis
        state: present

    - name: Configure Redis bind address
      ansible.builtin.lineinfile:
        path: /etc/redis/redis.conf
        regexp: "^bind "
        line: "bind 0.0.0.0 -::1"
      notify: Restart Redis

    - name: Disable protected mode for lab
      ansible.builtin.lineinfile:
        path: /etc/redis/redis.conf
        regexp: "^protected-mode "
        line: "protected-mode no"
      notify: Restart Redis

    - name: Enable and start Redis
      ansible.builtin.systemd_service:
        name: redis
        enabled: true
        state: started

    - name: Apply configuration
      ansible.builtin.meta: flush_handlers

    - name: Verify Redis
      ansible.builtin.command: redis-cli ping
      register: redis_ping
      changed_when: false
      failed_when: redis_ping.stdout != "PONG"

    - name: Display result
      ansible.builtin.debug:
        msg: "Redis response: {{ redis_ping.stdout }}"

  handlers:
    - name: Restart Redis
      ansible.builtin.systemd_service:
        name: redis
        state: restarted
