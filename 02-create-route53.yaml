---
- name: Create or update RoboShop Route 53 DNS records
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - group_vars/all.yaml

  vars:
    route53_zone_id: "Z047542739NDVFK4NND1"

  tasks:
    - name: Get Route 53 hosted zone details
      ansible.builtin.command:
        argv:
          - aws
          - route53
          - get-hosted-zone
          - --id
          - "{{ route53_zone_id }}"
          - --output
          - json
      register: zone_response
      changed_when: false

    - name: Validate hosted zone name
      ansible.builtin.assert:
        that:
          - (zone_response.stdout | from_json).HostedZone.Name == (domain_name ~ '.')
        fail_msg: "Hosted zone does not match {{ domain_name }}"

    - name: Find running RoboShop EC2 instances
      amazon.aws.ec2_instance_info:
        region: "{{ aws_region }}"
        filters:
          "tag:Name": "{{ item.name }}"
          "tag:Project": roboshop
          instance-state-name:
            - running
      loop: "{{ instances }}"
      loop_control:
        label: "{{ item.name }}"
      register: ec2_lookup

    - name: Validate EC2 instances and private IPs
      ansible.builtin.assert:
        that:
          - item.instances | length == 1
          - (item.instances[0].private_ip_address | default('')) | length > 0
        fail_msg: >-
          Expected exactly one running RoboShop EC2 instance
          with a private IP for {{ item.item.name }}
      loop: "{{ ec2_lookup.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Display DNS records to update
      ansible.builtin.debug:
        msg: >-
          {{ item.item.name }}.{{ domain_name }}
          -> {{ item.instances[0].private_ip_address }}
      loop: "{{ ec2_lookup.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Create or update Route 53 A records
      amazon.aws.route53:
        state: present
        overwrite: true
        hosted_zone_id: "{{ route53_zone_id }}"
        record: "{{ item.item.name }}.{{ domain_name }}"
        type: A
        ttl: 60
        value: "{{ item.instances[0].private_ip_address }}"
        wait: true
      loop: "{{ ec2_lookup.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Display DNS update results
      ansible.builtin.debug:
        msg: >-
          DNS update submitted for
          {{ item.item.name }}.{{ domain_name }}
      loop: "{{ ec2_lookup.results }}"
      loop_control:
        label: "{{ item.item.name }}"
