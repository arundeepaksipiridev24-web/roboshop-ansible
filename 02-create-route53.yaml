---
- name: Create or replace RoboShop Route 53 A records
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - group_vars/all.yaml

  vars:
    # Set this to the exact existing hosted zone ID after verifying it.
    route53_zone_id: "REPLACE_WITH_HOSTED_ZONE_ID"

  tasks:
    - name: Require a verified hosted zone ID
      ansible.builtin.assert:
        that:
          - route53_zone_id != 'REPLACE_WITH_HOSTED_ZONE_ID'
          - route53_zone_id | length > 0
        fail_msg: "Set route53_zone_id to the verified hosted zone ID first."

    - name: Read hosted zone details
      ansible.builtin.command:
        argv:
          - aws
          - route53
          - get-hosted-zone
          - --id
          - "{{ route53_zone_id }}"
          - --output
          - json
      register: zone_response
      changed_when: false

    - name: Validate hosted zone name
      ansible.builtin.assert:
        that:
          - (zone_response.stdout | from_json).HostedZone.Name == (domain_name ~ '.')
        fail_msg: "Hosted zone does not match {{ domain_name }}."

    - name: Look up EC2 instances by service and project tags
      amazon.aws.ec2_instance_info:
        region: "{{ aws_region }}"
        filters:
          "tag:Name": "{{ item.name }}"
          "tag:Project": roboshop
          instance-state-name:
            - running
      loop: "{{ instances }}"
      loop_control:
        label: "{{ item.name }}"
      register: ec2_lookup

    - name: Ensure exactly one running instance and private IP per service
      ansible.builtin.assert:
        that:
          - item.instances | length == 1
          - (item.instances[0].private_ip_address | default('')) | length > 0
        fail_msg: "Expected exactly one running tagged EC2 instance with private IP for {{ item.item.name }}."
      loop: "{{ ec2_lookup.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Display planned DNS replacements
      ansible.builtin.debug:
        msg: "{{ item.item.name }}.{{ domain_name }} -> {{ item.instances[0].private_ip_address }}"
      loop: "{{ ec2_lookup.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: UPSERT Route 53 A records without deleting them first
      amazon.aws.route53:
        state: present
        overwrite: true
        zone_id: "{{ route53_zone_id }}"
        record: "{{ item.item.name }}.{{ domain_name }}"
        type: A
        ttl: 60
        value: "{{ item.instances[0].private_ip_address }}"
        wait: true
      loop: "{{ ec2_lookup.results }}"
      loop_control:
        label: "{{ item.item.name }}"
