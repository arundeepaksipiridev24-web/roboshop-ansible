---
- name: Create or update RoboShop Route 53 DNS records
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars_files:
    - group_vars/all/main.yaml

  vars:
    route53_zone_id: "Z047542739NDVFK4NND1"
    aws_cli: /usr/local/bin/aws
    route53_ttl: 1

  environment:
    PATH: "/usr/local/bin:/usr/bin:/bin"

  tasks:
    - name: Verify AWS CLI installation
      ansible.builtin.command:
        argv:
          - "{{ aws_cli }}"
          - --version
      register: aws_cli_version
      changed_when: false

    - name: Display AWS CLI version
      ansible.builtin.debug:
        var: aws_cli_version.stdout

    - name: Verify AWS authentication
      ansible.builtin.command:
        argv:
          - "{{ aws_cli }}"
          - sts
          - get-caller-identity
          - --region
          - "{{ aws_region }}"
          - --output
          - json
      register: aws_identity
      changed_when: false
      no_log: true

    - name: Confirm AWS authentication
      ansible.builtin.debug:
        msg: "AWS authentication successful"

    - name: Get Route 53 hosted zone details
      ansible.builtin.command:
        argv:
          - "{{ aws_cli }}"
          - route53
          - get-hosted-zone
          - --id
          - "{{ route53_zone_id }}"
          - --output
          - json
      register: zone_response
      changed_when: false

    - name: Validate hosted zone name
      ansible.builtin.assert:
        that:
          - >-
            (zone_response.stdout | from_json).HostedZone.Name
            == (domain_name ~ '.')
        fail_msg: >-
          Hosted zone {{ route53_zone_id }}
          does not match {{ domain_name }}

    - name: Find running RoboShop EC2 instances
      amazon.aws.ec2_instance_info:
        region: "{{ aws_region }}"
        filters:
          "tag:Name": "{{ item.name }}"
          instance-state-name:
            - running
      loop: "{{ instances }}"
      loop_control:
        label: "{{ item.name }}"
      register: ec2_lookup

    - name: Validate EC2 instances and IPs
      ansible.builtin.assert:
        that:
          - item.instances | length == 1
          - >-
            (item.instances[0].private_ip_address
            | default('')) | length > 0
          - >-
            item.item.name != 'frontend' or
            (item.instances[0].public_ip_address
            | default('') | length > 0)
        fail_msg: >-
          Missing or duplicate running EC2 instance,
          private IP, or frontend public IP for
          {{ item.item.name }}
      loop: "{{ ec2_lookup.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Display DNS records
      ansible.builtin.debug:
        msg: >-
          {{ item.item.name }}.{{ domain_name }}
          ->
          {{
            item.instances[0].public_ip_address
            if item.item.name == 'frontend'
            else item.instances[0].private_ip_address
          }}
      loop: "{{ ec2_lookup.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Create or update service DNS records
      amazon.aws.route53:
        state: present
        zone: "{{ domain_name }}"
        record: "{{ item.item.name }}.{{ domain_name }}"
        type: A
        ttl: "{{ route53_ttl }}"
        value: >-
          {{
            item.instances[0].public_ip_address
            if item.item.name == 'frontend'
            else item.instances[0].private_ip_address
          }}
        overwrite: true
        wait: true
      loop: "{{ ec2_lookup.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Find frontend EC2 result
      ansible.builtin.set_fact:
        frontend_ec2: "{{ item.instances[0] }}"
      loop: "{{ ec2_lookup.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: item.item.name == 'frontend'

    - name: Create or update root domain A record
      amazon.aws.route53:
        state: present
        zone: "{{ domain_name }}"
        record: "{{ domain_name }}"
        type: A
        ttl: "{{ route53_ttl }}"
        value: "{{ frontend_ec2.public_ip_address }}"
        overwrite: true
        wait: true
      when: frontend_ec2 is defined

    - name: Display DNS update results
      ansible.builtin.debug:
        msg: >-
          DNS updated:
          {{ item.item.name }}.{{ domain_name }}
      loop: "{{ ec2_lookup.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Display root domain DNS
      ansible.builtin.debug:
        msg: >-
          {{ domain_name }}
          -> {{ frontend_ec2.public_ip_address }}
      when: frontend_ec2 is defined

    - name: Display completion message
      ansible.builtin.debug:
        msg: >-
          RoboShop Route 53 DNS configuration
          completed successfully
