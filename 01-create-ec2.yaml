---
- name: Create RoboShop EC2 instances
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars_files:
    - group_vars/all.yaml

  vars:
    vpc_id: vpc-0e7b5f1d5107e4368
    subnet_id: subnet-03830e2ebcab777e8
    aws_cli: /usr/local/bin/aws
    domain_name: sodhichebutha.online

  environment:
    PATH: "/usr/local/bin:/usr/bin:/bin"

  tasks:
    - name: Verify AWS CLI installation
      ansible.builtin.command:
        argv:
          - "{{ aws_cli }}"
          - --version
      register: aws_cli_version
      changed_when: false

    - name: Display AWS CLI version
      ansible.builtin.debug:
        var: aws_cli_version.stdout

    - name: Verify AWS authentication
      ansible.builtin.command:
        argv:
          - "{{ aws_cli }}"
          - sts
          - get-caller-identity
          - --region
          - "{{ aws_region }}"
          - --output
          - json
      register: aws_identity
      changed_when: false
      no_log: true

    - name: Confirm AWS authentication
      ansible.builtin.debug:
        msg: "AWS CLI authentication successful"

    - name: Look up existing security groups
      ansible.builtin.command:
        argv:
          - "{{ aws_cli }}"
          - ec2
          - describe-security-groups
          - --filters
          - "Name=vpc-id,Values={{ vpc_id }}"
          - --region
          - "{{ aws_region }}"
          - --output
          - json
      register: sg_lookup
      changed_when: false

    - name: Store security group information
      ansible.builtin.set_fact:
        sg_info: "{{ (sg_lookup.stdout | from_json).SecurityGroups }}"

    - name: Validate required security groups
      ansible.builtin.assert:
        that:
          - item.security_group in (sg_info | map(attribute='GroupName') | list)
          - common_sg in (sg_info | map(attribute='GroupName') | list)
        fail_msg: >-
          Missing security group {{ item.security_group }}
          or {{ common_sg }} in VPC {{ vpc_id }}
      loop: "{{ instances }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Validate subnet belongs to VPC
      ansible.builtin.command:
        argv:
          - "{{ aws_cli }}"
          - ec2
          - describe-subnets
          - --subnet-ids
          - "{{ subnet_id }}"
          - --region
          - "{{ aws_region }}"
          - --query
          - "Subnets[0].VpcId"
          - --output
          - text
      register: subnet_vpc
      changed_when: false

    - name: Confirm subnet VPC
      ansible.builtin.assert:
        that:
          - subnet_vpc.stdout == vpc_id
        fail_msg: "Subnet does not belong to {{ vpc_id }}"

    - name: Verify AMI exists
      ansible.builtin.command:
        argv:
          - "{{ aws_cli }}"
          - ec2
          - describe-images
          - --image-ids
          - "{{ ami_id }}"
          - --region
          - "{{ aws_region }}"
          - --query
          - "Images[0].State"
          - --output
          - text
      register: ami_state
      changed_when: false

    - name: Validate AMI
      ansible.builtin.assert:
        that:
          - ami_state.stdout == 'available'
        fail_msg: "AMI {{ ami_id }} is not available"

    - name: Validate instance names are unique
      ansible.builtin.assert:
        that:
          - (instances | map(attribute='name') | list | unique | list | length) == (instances | length)
        fail_msg: "Duplicate instance names found"

    - name: Check existing RoboShop EC2 instances
      amazon.aws.ec2_instance_info:
        region: "{{ aws_region }}"
        filters:
          "tag:Name": "{{ item.name }}"
          instance-state-name:
            - pending
            - running
            - stopping
            - stopped
      loop: "{{ instances }}"
      loop_control:
        label: "{{ item.name }}"
      register: existing_instances

    - name: Prevent duplicate EC2 instance creation
      ansible.builtin.assert:
        that:
          - item.instances | length <= 1
        fail_msg: >-
          Multiple existing EC2 instances found for
          {{ item.item.name }}
      loop: "{{ existing_instances.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Create missing RoboShop EC2 instances
      amazon.aws.ec2_instance:
        region: "{{ aws_region }}"
        name: "{{ item.item.name }}"
        image_id: "{{ ami_id }}"
        instance_type: "{{ instance_type }}"
        vpc_subnet_id: "{{ subnet_id }}"
        security_groups:
          - "{{ item.item.security_group }}"
          - "{{ common_sg }}"
        network:
          assign_public_ip: "{{ item.item.name == 'frontend' }}"
        exact_count: 1
        filters:
          "tag:Name": "{{ item.item.name }}"
          instance-state-name:
            - pending
            - running
            - stopping
            - stopped
        tags:
          Project: roboshop
          ManagedBy: ansible
        wait: true
      loop: "{{ existing_instances.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: item.instances | length == 0
      register: created_instances

    - name: Display existing EC2 instances
      ansible.builtin.debug:
        msg: >-
          {{ item.item.name }} already exists:
          {{ item.instances | map(attribute='instance_id') | list }}
      loop: "{{ existing_instances.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: item.instances | length > 0

    - name: Display newly created EC2 instances
      ansible.builtin.debug:
        msg: >-
          {{ item.item.item.name }} created:
          {{ item.instances | map(attribute='instance_id') | list }}
      loop: "{{ created_instances.results }}"
      loop_control:
        label: "{{ item.item.item.name }}"
      when:
        - not (item.skipped | default(false))
        - item.instances is defined

    # NEW: Discover current EC2 IPs

    - name: Refresh RoboShop instance information
      amazon.aws.ec2_instance_info:
        region: "{{ aws_region }}"
        filters:
          "tag:Name": "{{ item.name }}"
          instance-state-name:
            - running
      loop: "{{ instances }}"
      loop_control:
        label: "{{ item.name }}"
      register: running_instances
      retries: 12
      delay: 10
      until: running_instances.instances | length == 1

    - name: Validate running instances
      ansible.builtin.assert:
        that:
          - item.instances | length == 1
          - item.instances[0].private_ip_address is defined
        fail_msg: "Instance {{ item.item.name }} is not ready"
      loop: "{{ running_instances.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    # NEW: Register private IPs dynamically

    - name: Register EC2 private IPs in Ansible
      ansible.builtin.add_host:
        name: >-
          {{ domain_name if item.item.name == 'frontend'
             else item.item.name ~ '.' ~ domain_name }}
        ansible_host: "{{ item.instances[0].private_ip_address }}"
        ansible_user: ec2-user
      loop: "{{ running_instances.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    # NEW: Wait until frontend SSH is available

    - name: Wait for frontend SSH port 22
      ansible.builtin.wait_for:
        host: "{{ item.instances[0].private_ip_address }}"
        port: 22
        delay: 5
        connect_timeout: 5
        timeout: 180
        state: started
      loop: "{{ running_instances.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: item.item.name == 'frontend'

    - name: Display frontend connection details
      ansible.builtin.debug:
        msg: >-
          Frontend {{ domain_name }} uses private IP
          {{ item.instances[0].private_ip_address }}
      loop: "{{ running_instances.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: item.item.name == 'frontend'

    - name: Display completion message
      ansible.builtin.debug:
        msg: "RoboShop EC2 provisioning and inventory registration completed"
