---
- name: Configure passwordless SSH for all RoboShop servers
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Ensure ec2-user SSH directory exists
      ansible.builtin.file:
        path: /home/ec2-user/.ssh
        state: directory
        owner: ec2-user
        group: ec2-user
        mode: "0700"

    - name: Install control node RSA public key
      ansible.posix.authorized_key:
        user: ec2-user
        state: present
        manage_dir: false
        key: "{{ lookup('file', '/home/ec2-user/.ssh/id_rsa.pub') }}"

    - name: Ensure passwordless sudo for ec2-user
      ansible.builtin.copy:
        dest: /etc/sudoers.d/90-roboshop-ansible
        content: "ec2-user ALL=(ALL) NOPASSWD: ALL\n"
        owner: root
        group: root
        mode: "0440"
        validate: "/usr/sbin/visudo -cf %s"

    - name: Confirm SSH setup
      ansible.builtin.debug:
        msg: "SSH key and sudo configured on {{ inventory_hostname }}"
