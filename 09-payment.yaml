---
- name: Deploy RoboShop Payment
  hosts: payment
  become: true
  vars:
    app_name: payment
    app_entry_path: /app/payment.py
    app_health_url: http://127.0.0.1:8080/health
  tasks:
  - name: Install Python and tools
    ansible.builtin.dnf:
      name:
      - python3.14
      - python3.14-pip
      - unzip
      state: present
  - name: Create account and deploy application archive
    ansible.builtin.import_tasks: tasks/application.yaml
  - name: Create virtual environment
    ansible.builtin.command:
      cmd: python3.14 -m venv /app/.venv
      creates: /app/.venv/bin/python
  - name: Install requirements
    ansible.builtin.pip:
      requirements: /app/requirements.txt
      virtualenv: /app/.venv
    notify: Restart application
  - name: Configure private RabbitMQ environment file
    ansible.builtin.import_tasks: tasks/rabbitmq-environment.yaml
  - name: Configure service and verify health
    ansible.builtin.import_tasks: tasks/service.yaml
  handlers:
  - name: Load application restart handler
    ansible.builtin.import_tasks: handlers/application.yaml
