---
- name: Deploy RoboShop Dispatch
  hosts: dispatch
  become: true
  vars:
    app_name: dispatch
    app_entry_path: /app/go.mod
    app_health_url: ''
  tasks:
  - name: Install Go and tools
    ansible.builtin.dnf:
      name:
      - golang
      - unzip
      state: present
  - name: Check Go version
    ansible.builtin.command: go version
    register: go_version
    changed_when: false
  - name: Show Go version
    ansible.builtin.debug:
      var: go_version.stdout
  - name: Create account and deploy application archive
    ansible.builtin.import_tasks: tasks/application.yaml
  - name: Check compiled binary
    ansible.builtin.stat:
      path: /app/dispatch
    register: binary
  - name: Build Dispatch
    ansible.builtin.command:
      cmd: go build -o /app/dispatch .
      chdir: /app
    environment:
      GOTOOLCHAIN: auto
    when: extracted.changed or not binary.stat.exists
    notify: Restart application
  - name: Make binary executable
    ansible.builtin.file:
      path: /app/dispatch
      mode: '0755'
  - name: Configure private RabbitMQ environment file
    ansible.builtin.import_tasks: tasks/rabbitmq-environment.yaml
  - name: Configure service and verify health
    ansible.builtin.import_tasks: tasks/service.yaml
  - name: Verify Dispatch service
    ansible.builtin.command: systemctl is-active dispatch
    changed_when: false
  handlers:
  - name: Load application restart handler
    ansible.builtin.import_tasks: handlers/application.yaml
