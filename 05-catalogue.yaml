---
- name: Deploy Catalogue
  hosts: catalogue
  become: true
  vars:
    app_name: catalogue
    app_entry_path: /app/server.js
    app_health_url: http://127.0.0.1:8080/health
  tasks:
  - name: Install Node.js and deploy application
    ansible.builtin.import_tasks: tasks/nodejs.yaml
  - name: Copy MongoDB repository
    ansible.builtin.copy:
      src: files/mongo.repo
      dest: /etc/yum.repos.d/mongo.repo
      mode: '0644'
  - name: Install MongoDB shell
    ansible.builtin.dnf:
      name: mongodb-mongosh
      state: present
  - name: Count existing catalogue products
    ansible.builtin.command:
      argv:
      - mongosh
      - --host
      - '{{ mongodb_host }}'
      - --quiet
      - --eval
      - db.getSiblingDB("catalogue").products.countDocuments({})
    register: product_count
    changed_when: false
  - name: Initialize catalogue master data once
    ansible.builtin.command:
      argv:
      - mongosh
      - --host
      - '{{ mongodb_host }}'
      - /app/db/master-data.js
    when: product_count.stdout | trim == '0'
    register: master_loaded
  - name: Assert product data exists
    ansible.builtin.assert:
      that: (product_count.stdout | trim | int) > 0 or master_loaded.changed | default(false)
      fail_msg: Catalogue master data missing
  - name: Configure service and verify health
    ansible.builtin.import_tasks: tasks/service.yaml
  handlers:
  - name: Load application restart handler
    ansible.builtin.import_tasks: handlers/application.yaml
