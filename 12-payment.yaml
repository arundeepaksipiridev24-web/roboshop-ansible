---
- name: Deploy RoboShop Payment
  hosts: payment
  become: true
  vars:
    payment_url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/payment-v4.zip
    rabbitmq_user: roboshop
  tasks:
    - name: Require RabbitMQ password from Vault
      ansible.builtin.assert:
        that: vault_rabbitmq_password is defined
        fail_msg: Define vault_rabbitmq_password in an encrypted Ansible Vault file
      no_log: true
    - name: Install Python and tools
      ansible.builtin.dnf:
        name: [python3.14, python3.14-pip, unzip]
        state: present
    - name: Create application user
      ansible.builtin.user:
        name: roboshop
        system: true
        home: /app
        shell: /sbin/nologin
        create_home: false
    - name: Create application directory
      ansible.builtin.file:
        path: /app
        state: directory
        mode: '0755'
    - name: Download Payment archive
      ansible.builtin.get_url:
        url: "{{ payment_url }}"
        dest: /tmp/payment-v4.zip
        mode: '0644'
      register: archive
    - name: Check application source
      ansible.builtin.stat:
        path: /app/payment.py
      register: source
    - name: Extract application
      ansible.builtin.unarchive:
        src: /tmp/payment-v4.zip
        dest: /app
        remote_src: true
      when: archive.changed or not source.stat.exists
      notify: Restart payment
    - name: Create virtual environment
      ansible.builtin.command:
        cmd: python3.14 -m venv /app/.venv
        creates: /app/.venv/bin/python
    - name: Install requirements
      ansible.builtin.pip:
        requirements: /app/requirements.txt
        virtualenv: /app/.venv
      notify: Restart payment
    - name: Create configuration directory
      ansible.builtin.file:
        path: /etc/roboshop
        state: directory
        mode: '0755'
    - name: Store RabbitMQ password securely
      ansible.builtin.copy:
        dest: /etc/roboshop/payment.env
        content: "AMQP_PASS={{ vault_rabbitmq_password }}\n"
        owner: root
        group: roboshop
        mode: '0640'
      no_log: true
      notify: Restart payment
    - name: Install Payment systemd unit
      ansible.builtin.template:
        src: templates/payment.service.j2
        dest: /etc/systemd/system/payment.service
        mode: '0644'
      notify: Restart payment
    - name: Start Payment service
      ansible.builtin.systemd_service:
        name: payment
        state: started
        enabled: true
        daemon_reload: true
    - name: Apply pending restarts
      ansible.builtin.meta: flush_handlers
    - name: Verify Payment health
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/health
        status_code: 200
      register: health
      retries: 10
      delay: 5
      until: health.status == 200
  handlers:
    - name: Restart payment
      ansible.builtin.systemd_service:
        name: payment
        state: restarted
        daemon_reload: true
