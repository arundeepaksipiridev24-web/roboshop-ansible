---
# AWS Configuration
aws_region: us-east-1
ami_id: ami-0055977a6e828a4f4
instance_type: t3.micro

# Route 53 Configuration
domain_name: sodhichebutha.online

# Common Security Group for all instances
common_sg: roboshop-common

# Ansible SSH User
ansible_user: ec2-user

instances:
  - name: mongodb
    security_group: roboshop-mongodb

  - name: redis
    security_group: roboshop-redis

  - name: mysql
    security_group: roboshop-mysql

  - name: rabbitmq
    security_group: roboshop-rabbitmq

  - name: catalogue
    security_group: roboshop-catalogue

  - name: user
    security_group: roboshop-user

  - name: cart
    security_group: roboshop-cart

  - name: shipping
    security_group: roboshop-shipping

  - name: frontend
    security_group: frontend
