---
# AWS Configuration
aws_region: us-east-1
ami_id: ami-0055977a6e828a4f4
instance_type: t3.micro

# Route 53 Configuration
domain_name: sodhichebutha.online

# Common Security Group for all instances
common_sg: roboshop-common

# Ansible SSH User
ansible_user: ec2-user

instances:
  - name: mongodb
    security_group: roboshop-mongodb

  - name: redis
    security_group: roboshop-redis

  - name: mysql
    security_group: roboshop-mysql

  - name: rabbitmq
    security_group: roboshop-rabbitmq

  - name: catalogue
    security_group: roboshop-catalogue

  - name: user
    security_group: roboshop-user

  - name: cart
    security_group: roboshop-cart

  - name: shipping
    security_group: roboshop-shipping

  - name: frontend
    security_group: roboshop-frontend

  - name: payment
    security_group: roboshop-payment

  - name: dispatch
    security_group: roboshop-dispatch

# Service endpoints and artifacts (matching roboshop-ansible-v1).
app_version: v4
artifact_base_url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts
mongodb_host: "mongodb.{{ domain_name }}"
redis_host: "redis.{{ domain_name }}"
mysql_host: "mysql.{{ domain_name }}"
rabbitmq_host: "rabbitmq.{{ domain_name }}"
catalogue_host: "catalogue.{{ domain_name }}"
user_host: "user.{{ domain_name }}"
cart_host: "cart.{{ domain_name }}"
shipping_host: "shipping.{{ domain_name }}"
payment_host: "payment.{{ domain_name }}"
# Shared RabbitMQ username; passwords are in credentials.yaml.
rabbitmq_user: roboshop
