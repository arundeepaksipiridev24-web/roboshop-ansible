
[defaults]
inventory = inventory.ini
remote_user = ec2-user
private_key_file = /home/ec2-user/.ssh/id_rsa
host_key_checking = True
timeout = 30

[privilege_escalation]
become = True
become_method = sudo
become_user = root

[ssh_connection]
# Trust a new host on first connection; still reject changed host keys.
ssh_common_args = -o StrictHostKeyChecking=accept-new
