
[defaults]
vault_password_file = ~/.ansible/roboshop-vault-pass
inventory = inventory.ini
host_key_checking = True
timeout = 30

[privilege_escalation]
become = True
become_method = sudo

[ssh_connection]
# Trust a new host on first connection; still reject changed host keys.
ssh_common_args = -o StrictHostKeyChecking=accept-new
